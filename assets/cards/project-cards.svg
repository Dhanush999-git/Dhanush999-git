<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="Selected Engineering Projects">
  <title>SELECTED PROJECTS</title>
  <defs>
    <linearGradient id="prj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <clipPath id="prj-card"><rect width="1000" height="580" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#prj-card)">
    <rect width="1000" height="580" fill="url(#prj-bg)"/>
    <g transform="translate(40, 42)">
      <text x="0" y="0" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="12" letter-spacing="3" fill="#00F2FE" font-weight="700">PROJECT ARCHIVES</text>
      <text x="920" y="0" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#64748B">PRODUCTION ARCHIVE</text>
      <line x1="0" y1="14" x2="920" y2="14" stroke="#1E293B" stroke-width="1"/>
    </g>
    <rect x="0.5" y="0.5" width="999" height="579" rx="16" fill="none" stroke="#1E293B" stroke-width="1"/>
  </g>
</svg>