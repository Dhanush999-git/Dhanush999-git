<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Engineering Philosophy - Three Core Pillars">
  <title>10 / ENGINEERING PHILOSOPHY — Three Core Pillars</title>
  <defs>
    <linearGradient id="nar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Pillar 1: Purpose (Cyan/Blue) -->
    <linearGradient id="p1-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1E33"/>
      <stop offset="100%" stop-color="#08101E"/>
    </linearGradient>

    <!-- Pillar 2: Precision (Violet) -->
    <linearGradient id="p2-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190F2E"/>
      <stop offset="100%" stop-color="#0D0719"/>
    </linearGradient>

    <!-- Pillar 3: Innovate (Emerald) -->
    <linearGradient id="p3-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E241E"/>
      <stop offset="100%" stop-color="#07130F"/>
    </linearGradient>

    <filter id="nar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="nar-card"><rect width="1000" height="460" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#nar-card)">
    <!-- Base Canvas -->
    <rect width="1000" height="460" fill="url(#nar-bg)"/>

    <!-- Section Header -->
    <g transform="translate(40, 42)">
      <text x="0" y="0" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="12" letter-spacing="3" fill="#00F2FE" font-weight="700">10 / ENGINEERING PHILOSOPHY</text>
      <text x="920" y="0" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#64748B">THREE CORE PILLARS</text>
      <line x1="0" y1="14" x2="920" y2="14" stroke="#1E293B" stroke-width="1"/>
    </g>

    <!-- Supporting Statement Quote -->
    <g transform="translate(40, 84)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" fill="#E2E8F0">"Great engineering is not just about writing code. It's about understanding problems,"</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-style="italic" font-size="15" fill="#38BDF8">"designing thoughtful solutions, and continuously improving them."</text>
    </g>

    <!-- THREE PILLAR CARDS -->
    <!-- PILLAR 1: BUILD WITH PURPOSE (Cyan Accent) -->
    <g transform="translate(40, 136)">
      <rect width="288" height="284" rx="12" fill="url(#p1-grad)" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.4"/>
      
      <!-- Number & Icon Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="0" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1.5" fill="#00F2FE" font-weight="700">PILLAR 01</text>
        <circle cx="236" cy="-4" r="8" fill="#0B1C2E" stroke="#00F2FE" stroke-width="1.2"/>
        <circle cx="236" cy="-4" r="3" fill="#00F2FE"/>
      </g>
      
      <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Build With Purpose</text>
      <text x="20" y="86" font-family="'SF Mono', monospace" font-size="10" fill="#38BDF8">REAL-WORLD · USABILITY · SOLUTIONS</text>
      <line x1="20" y1="100" x2="268" y2="100" stroke="#1E293B" stroke-width="1"/>

      <g transform="translate(20, 122)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94A3B8">
        <text x="0" y="0">Transform ideas into practical</text>
        <text x="0" y="18">applications that solve real-world</text>
        <text x="0" y="36">problems. Focus on meaningful</text>
        <text x="0" y="54">features, usability, and delivering</text>
        <text x="0" y="72">functional solutions.</text>
      </g>

      <!-- Tech tags bottom -->
      <g transform="translate(20, 236)">
        <rect x="0" y="0" width="104" height="22" rx="4" fill="#091829" stroke="#1E3A5F" stroke-width="0.8"/>
        <text x="52" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#00F2FE">Real-World Solns</text>
        <rect x="112" y="0" width="82" height="22" rx="4" fill="#091829" stroke="#1E3A5F" stroke-width="0.8"/>
        <text x="153" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#00F2FE">Usability</text>
      </g>
    </g>

    <!-- PILLAR 2: ENGINEER WITH PRECISION (Violet Accent) -->
    <g transform="translate(356, 136)">
      <rect width="288" height="284" rx="12" fill="url(#p2-grad)" stroke="#7928CA" stroke-width="1.2" stroke-opacity="0.4"/>
      
      <!-- Number & Icon Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="0" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1.5" fill="#C084FC" font-weight="700">PILLAR 02</text>
        <circle cx="236" cy="-4" r="8" fill="#1C0E33" stroke="#7928CA" stroke-width="1.2"/>
        <circle cx="236" cy="-4" r="3" fill="#C084FC"/>
      </g>
      
      <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Engineer With Precision</text>
      <text x="20" y="86" font-family="'SF Mono', monospace" font-size="10" fill="#C084FC">CLEAN CODE · BACKEND · APIS</text>
      <line x1="20" y1="100" x2="268" y2="100" stroke="#1E293B" stroke-width="1"/>

      <g transform="translate(20, 122)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94A3B8">
        <text x="0" y="0">Write clean, maintainable code.</text>
        <text x="0" y="18">Design reliable backend systems,</text>
        <text x="0" y="36">integrate APIs, structure</text>
        <text x="0" y="54">databases, and build scalable</text>
        <text x="0" y="72">full-stack applications.</text>
      </g>

      <!-- Tech tags bottom -->
      <g transform="translate(20, 236)">
        <rect x="0" y="0" width="84" height="22" rx="4" fill="#1A0D30" stroke="#4C1D95" stroke-width="0.8"/>
        <text x="42" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#C084FC">Clean Code</text>
        <rect x="92" y="0" width="66" height="22" rx="4" fill="#1A0D30" stroke="#4C1D95" stroke-width="0.8"/>
        <text x="125" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#C084FC">APIs</text>
        <rect x="166" y="0" width="80" height="22" rx="4" fill="#1A0D30" stroke="#4C1D95" stroke-width="0.8"/>
        <text x="206" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#C084FC">Databases</text>
      </g>
    </g>

    <!-- PILLAR 3: LEARN. EXPLORE. INNOVATE. (Emerald Accent) -->
    <g transform="translate(672, 136)">
      <rect width="288" height="284" rx="12" fill="url(#p3-grad)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.4"/>
      
      <!-- Number & Icon Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="0" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1.5" fill="#34D399" font-weight="700">PILLAR 03</text>
        <circle cx="236" cy="-4" r="8" fill="#0C261E" stroke="#10B981" stroke-width="1.2"/>
        <circle cx="236" cy="-4" r="3" fill="#34D399"/>
      </g>
      
      <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Learn. Explore. Innovate.</text>
      <text x="20" y="86" font-family="'SF Mono', monospace" font-size="10" fill="#34D399">GROWTH · SKILLS · EXPLORATION</text>
      <line x1="20" y1="100" x2="268" y2="100" stroke="#1E293B" stroke-width="1"/>

      <g transform="translate(20, 122)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94A3B8">
        <text x="0" y="0">Continuously explore emerging</text>
        <text x="0" y="18">technologies, strengthen</text>
        <text x="0" y="36">problem-solving skills, and</text>
        <text x="0" y="54">experiment with new approaches</text>
        <text x="0" y="72">to software engineering.</text>
      </g>

      <!-- Tech tags bottom -->
      <g transform="translate(20, 236)">
        <rect x="0" y="0" width="94" height="22" rx="4" fill="#092019" stroke="#065F46" stroke-width="0.8"/>
        <text x="47" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#34D399">Emerging Tech</text>
        <rect x="102" y="0" width="80" height="22" rx="4" fill="#092019" stroke="#065F46" stroke-width="0.8"/>
        <text x="142" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9" fill="#34D399">Innovation</text>
      </g>
    </g>

    <!-- Outer Card Border -->
    <rect x="0.5" y="0.5" width="999" height="459" rx="16" fill="none" stroke="#1E293B" stroke-width="1"/>
  </g>
</svg>