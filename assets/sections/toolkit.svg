        <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Motion &amp; Visual Design</text>
        <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">Integrated visual storytelling</text>
        <text x="16" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">complementing software engineering</text>
